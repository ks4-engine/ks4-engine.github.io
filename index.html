<!DOCTYPE   html>
<html lang="en">          
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS4 Engine Mirrors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
            min-height: 100%;
        }

        body {
            font-family: 'Jetbrains Mono', monospace;
            background-image: url("https://img.itch.zone/aW1nLzI2MzE0NzMxLnBuZw==/original/lwIL2C.png");
            background-repeat: repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 2rem 0;
        }

        main {
            position: relative;
            background: white;
            width: min(90vw, 600px);
            padding: 2rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
            line-height: 1.8;
        }

        h1, p {
            margin: 0;
        }
        h1 {
            font-weight: 450;
        }
        p {
            margin-top: 1rem;
            color: #000000;
        }

        .top-links {
            max-width: min(90vw, 600px);
            margin: 0 auto 1.5rem;
            text-align: left;
        }

        .top-links a {
            color: black;
            font-weight: 450;
            text-decoration: none;
            margin-right: 1rem;
        }

        .top-links a:hover {
            text-decoration: underline;
        }

        .top-links button {
            border: 1px solid #333;
            background: transparent;
            color: #333;
            padding: 0.5rem 1rem;
            font: inherit;
            cursor: pointer;
            border-radius: 0.25rem;
            margin-left: 1rem;
        }

        .top-links button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark-mode {
            background: #121212;
            color: #f3f3f3;
        }

        main.dark-mode {
            background: #1f1f1f;
            color: #f3f3f3;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        body.dark-mode p {
            color: #ffffff;
        }

        body.dark-mode .top-links a,
        body.dark-mode .top-links button {
            color: #f3f3f3;
        }

        body.dark-mode .top-links button {
            border-color: #f3f3f3;
        }

        .bottom-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1rem auto 0;
        }
    </style>
</head>
<body>
    <div class="top-links">
        <a href="mirrors">download</a>
        <a href="https://drakeraz09.itch.io/ks4">itch.io</a>
        <button id="darkModeToggle" type="button">Toggle Dark Mode</button>
    </div>
<main>
    <h1>KS4 Engine (the website)</h1>
    <p>KS4 Engine is an Incredibox engine written for PenguinMod that has a really good animation editor with internal OOP paradigms when it comes to spriting. Neat, eh? Eh? Download it or something.</p>
    <h1>IMAGE GALLERY!!!!</h1>
    <img src="https://img.itch.zone/aW1nLzI2MzE0Njc5LnBuZw==/347x500/GpbsNQ.png" alt="bottom art" class="bottom-image">
    <img src="https://img.itch.zone/aW1nLzI2MzE0NzQxLnBuZw==/original/1U8kZD.png" alt="bottom art" class="bottom-image">
    <img src="https://img.itch.zone/aW1nLzI2MzE0NzU2LnBuZw==/original/jBR0Rw.png" alt="bottom art" class="bottom-image">
</main>
    <script>
        const toggleButton = document.getElementById("darkModeToggle");
        const pageBody = document.body;
        const pageMain = document.querySelector("main");

        toggleButton.addEventListener("click", () => {
            pageBody.classList.toggle("dark-mode");
            pageMain.classList.toggle("dark-mode");
        });
    </script>
</html>
